{# store/templates/store/_brand_card.html #}

{# ✅ [핵심 변경] 클릭 이벤트를 위해 전체를 div로 감쌉니다. #}
<div class="product-card">
    <a href="{{ brand.link }}" target="_blank" rel="noopener noreferrer" class="thumbnail-wrapper">
        {% if brand.thumbnail %}
            <img src="{{ brand.thumbnail.url }}" alt="{{ brand.name }} 로고">
        {% else %}
            <div class="thumbnail-placeholder">
                <span>{{ brand.name|first }}</span>
            </div>
        {% endif %}
    </a>
    <div class="card-body">
        <h3 class="product-name">{{ brand.name }}</h3>
        <span class="category-tag">{{ brand.get_category_display }}</span>
        
        {# ✅ [핵심 변경] '자세히 보기' 버튼을 추가합니다. brand.id를 데이터 속성으로 전달합니다. #}
        <button class="quick-view-btn" data-brandid="{{ brand.id }}">
            자세히 보기
        </button>
    </div>
</div>
