{% extends 'web/dashboard_sliding_base.html' %}
{% load static %}

{% block title %}AI 운동 루틴 생성{% endblock %}

{% block page_content %}
<script src="https://cdn.tailwindcss.com"></script>
<style>
    @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    .fade-in-up { animation: fadeInUp 0.5s ease-out forwards; }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: #1f2937; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 3px; }
    #search-exercise-input::placeholder { color: #6b7280; }
    @keyframes popIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
    .animate-pop-in { animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
    .muscle-button { display: flex; flex-direction: column; align-items: center; padding: 0.75rem; background-color: rgba(55, 65, 81, 0.5); border-radius: 0.5rem; border: 1px solid transparent; transition: all 0.2s ease-in-out; filter: grayscale(100%); opacity: 0.7; }
    .muscle-button .button-text { font-size: 0.75rem; margin-top: 0.25rem; color: #9ca3af; transition: color 0.2s ease-in-out; }
    .muscle-button:hover { filter: grayscale(50%); opacity: 0.9; border-color: rgba(110, 231, 183, 0.5); }
    .muscle-button.active { filter: grayscale(0%); opacity: 1; background-color: #10B981; border-color: #10B981; }
    .muscle-button.active .button-text { color: white; }
    .cart-input { background-color: #111827; border: 1px solid #4b5563; color: white; text-align: center; padding: 0.25rem; border-radius: 0.375rem; width: 100%; font-size: 0.875rem; -moz-appearance: textfield; appearance: textfield; }
    .cart-input::-webkit-outer-spin-button, .cart-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    .cart-input:focus { 
        outline: none; 
        box-shadow: 0 0 0 2px #10B981;
    }
    .cart-select { 
        background-color: #111827; border: 1px solid #4b5563; color: white; 
        padding: 0.25rem 0.5rem; border-radius: 0.375rem; width: 100%; font-size: 0.875rem; 
        background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%236b7280' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='M6 8l4 4 4-4'/%3e%3c/svg%3e"); 
        background-position: right 0.5rem center; background-repeat: no-repeat; background-size: 1.5em 1.5em; 
        -webkit-appearance: none; -moz-appearance: none; 
        appearance: none;
    }
    .cart-select:focus { 
        outline: none; 
        box-shadow: 0 0 0 2px #10B981;
    }
    .exercise-item.added { background-color: #1f2937 !important; cursor: not-allowed; }
    .exercise-item.added .exercise-name { text-decoration: line-through; color: #4b5563; }
    .pagination-button {
        padding: 0.5rem 0.8rem; border-radius: 0.375rem; background-color: #374151;
        color: #d1d5db; font-size: 0.875rem; font-weight: 600; transition: background-color 0.2s;
        border: none; cursor: pointer;
    }
    .pagination-button:hover { background-color: #4b5563; }
    .pagination-button.active { background-color: #10B981; color: white; }
</style>

<div class="p-6 sm:p-8">
    <header class="text-left mb-12">
        <div class="border-l-4 border-emerald-400 pl-4">
            <h1 class="text-3xl sm:text-4xl font-bold tracking-tight text-white">Routine Builder</h1>
            <p class="text-md text-gray-400 mt-2">AI의 도움을 받거나 직접 운동을 조합하여 나만의 루틴을 만드세요.</p>
        </div>
    </header>

    <div class="max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-5 gap-8">
        <!-- 왼쪽: 루틴 생성 패널 -->
        <div class="lg:col-span-2 bg-gray-800/50 backdrop-blur-sm border border-white/10 p-6 rounded-2xl shadow-lg flex flex-col gap-6 fade-in-up">
            <div>
                <h3 class="text-xl font-bold mb-4 flex items-center gap-2 text-white"><i class="bi bi-robot text-blue-400"></i> AI 추천 루틴</h3>
                <div class="grid sm:grid-cols-2 gap-4">
                    <div>
                        <label for="part" class="block text-sm font-medium text-gray-400 mb-1">운동 부위</label>
                        <select id="part" class="w-full bg-gray-700 border border-gray-600 rounded-lg px-3 py-2 text-white focus:ring-blue-500 focus:border-blue-500">
                            <option>하체</option><option>등</option><option>가슴</option><option>어깨</option><option>팔</option><option>복근</option>
                        </select>
                    </div>
                    <div>
                        <label for="level" class="block text-sm font-medium text-gray-400 mb-1">운동 난이도</label>
                        <select id="level" class="w-full bg-gray-700 border border-gray-600 rounded-lg px-3 py-2 text-white focus:ring-blue-500 focus:border-blue-500">
                            <option>초급</option><option>중급</option><option>고급</option>
                        </select>
                    </div>
                </div>
                <button onclick="goToGptPlan()" class="mt-4 w-full bg-gradient-to-r from-blue-500 to-cyan-500 text-white font-bold py-2.5 rounded-lg transition-all duration-300 hover:scale-105">GPT로 추천 받기</button>
            </div>
            <hr class="border-gray-700">
            <div>
                <h3 class="text-xl font-bold mb-4 flex items-center gap-2 text-white"><i class="bi bi-cart-plus-fill text-green-400"></i> 내 루틴 (장바구니)</h3>
                <div id="customCart" class="space-y-3 bg-black/20 p-3 rounded-lg min-h-[150px]"></div>
                <button onclick="submitCustomPlan()" class="mt-4 w-full bg-gradient-to-r from-green-500 to-emerald-500 text-white font-bold py-2.5 rounded-lg transition-all duration-300 hover:scale-105">이 조합으로 내 루틴 만들기</button>
            </div>
        </div>

        <!-- 오른쪽: 운동 라이브러리 -->
        <div class="lg:col-span-3 bg-gray-800/30 backdrop-blur-sm border border-white/10 p-6 rounded-2xl shadow-lg flex flex-col fade-in-up" style="animation-delay: 0.15s;">
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-400 mb-2">운동 라이브러리</label>
                <div id="muscle-group-buttons" class="grid grid-cols-4 md:grid-cols-7 gap-2">
                     <button onclick="loadExercises('하체', this)" class="group muscle-button">🦵<span class="button-text">하체</span></button>
                     <button onclick="loadExercises('등', this)" class="group muscle-button">💪<span class="button-text">등</span></button>
                     <button onclick="loadExercises('가슴', this)" class="group muscle-button">🔥<span class="button-text">가슴</span></button>
                     <button onclick="loadExercises('어깨', this)" class="group muscle-button">🏋️<span class="button-text">어깨</span></button>
                     <button onclick="loadExercises('팔', this)" class="group muscle-button">🦾<span class="button-text">팔</span></button>
                     <button onclick="loadExercises('복근', this)" class="group muscle-button">🍫<span class="button-text">복근</span></button>
                     <button onclick="loadExercises('유산소', this)" class="group muscle-button">🏃<span class="button-text">유산소</span></button>
                </div>
            </div>
            <div class="flex items-center gap-2 mb-3">
                <input type="text" id="search-exercise-input" placeholder="운동 이름 검색..." class="flex-grow bg-gray-900/50 border border-gray-700 rounded-lg py-2 px-4 text-sm text-white focus:ring-1 focus:ring-emerald-500 focus:border-emerald-500 transition">
                <button id="search-button" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2 px-4 rounded-lg transition-colors"><i class="bi bi-search"></i></button>
            </div>
            <div id="exerciseList" class="flex-grow bg-black/20 p-3 rounded-lg custom-scrollbar overflow-y-auto min-h-0">
                <div class="flex items-center justify-center h-full text-gray-500">운동 부위를 선택하세요.</div>
            </div>
            <div id="pagination-controls" class="flex justify-center items-center mt-4 space-x-2"></div>
        </div>
    </div>
</div>

<!-- 운동 상세 정보 모달 -->
<div id="exercise-modal-backdrop" class="modal-backdrop fixed inset-0 bg-black bg-opacity-70 backdrop-blur-sm hidden z-40"></div>
<div id="exercise-modal" class="modal fixed inset-0 flex items-center justify-center p-4 hidden z-50">
    <div class="bg-gray-800 border border-gray-700 rounded-2xl shadow-xl w-full max-w-4xl max-h-[90vh] flex flex-col animate-pop-in">
        <div class="flex items-center justify-between p-4 border-b border-gray-700">
            <h3 id="modal-title" class="text-xl font-bold text-white">운동 상세 정보</h3>
            <button id="modal-close-button" class="text-gray-400 hover:text-white text-2xl">×</button>
        </div>
        <div class="p-6 flex-grow overflow-y-auto custom-scrollbar">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <h4 class="text-lg font-semibold text-emerald-400 mb-2">운동 자세 (GIF)</h4>
                    <img id="modal-gif" src="" alt="운동 GIF" class="w-full rounded-lg border border-gray-600">
                </div>
                <div>
                    <h4 class="text-lg font-semibold text-blue-400 mb-2">참고 영상 (YouTube)</h4>
                    <div id="modal-youtube-container" class="space-y-3"></div>
                </div>
            </div>
        </div>
    </div>
</div>


<script>
    const gptPlanUrl = "{% url 'routine:gpt_plan' %}";
    const customPlanUrl = "{% url 'routine:custom_plan' %}";
    const exerciseApiUrl = "{% url 'routine:api_exercises' %}";
    const youtubeSearchApiUrl = "{% url 'routine:api_youtube_search' %}";

    let allFetchedExercises = [];
    let currentActiveButton = null;
    let currentPage = 1;
    const itemsPerPage = 10;

    const modal = document.getElementById('exercise-modal');
    const modalBackdrop = document.getElementById('exercise-modal-backdrop');
    const modalCloseButton = document.getElementById('modal-close-button');
    const modalTitle = document.getElementById('modal-title');
    const modalGif = document.getElementById('modal-gif');
    const modalYoutubeContainer = document.getElementById('modal-youtube-container');

    document.addEventListener('DOMContentLoaded', () => {
        document.getElementById('search-button').addEventListener('click', performSearch);
        document.getElementById('search-exercise-input').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') { e.preventDefault(); performSearch(); }
        });
        
        modalBackdrop.addEventListener('click', hideExerciseDetails);
        modalCloseButton.addEventListener('click', hideExerciseDetails);
        document.addEventListener('keydown', (e) => {
            if (e.key === "Escape" && !modal.classList.contains('hidden')) {
                hideExerciseDetails();
            }
        });
    });

    function performSearch() {
        currentPage = 1;
        filterExercises(document.getElementById('search-exercise-input').value);
    }
    
    function goToGptPlan() {
        window.location.href = `${gptPlanUrl}?part=${encodeURIComponent(document.getElementById("part").value)}&level=${encodeURIComponent(document.getElementById("level").value)}`;
    }

    function addToCart(name, muscle_group, gif_url, exercise_type) {
        const cart = document.getElementById("customCart");
        if ([...cart.querySelectorAll("li")].some(li => li.dataset.name === name)) {
            return;
        }
        
        const exerciseItemInList = document.querySelector(`.exercise-item[data-name="${name.replace(/'/g, "\\'")}"]`);
        if (exerciseItemInList) {
            exerciseItemInList.classList.add('added');
            exerciseItemInList.classList.remove('clickable');
            exerciseItemInList.removeAttribute('onclick');
            exerciseItemInList.querySelector('.added-icon').classList.remove('hidden');
        }
        
        const li = document.createElement("li");
        li.dataset.name = name;
        li.dataset.type = exercise_type;
        li.className = "bg-gray-700/50 p-3 rounded-lg text-sm border border-gray-700 animate-pop-in";
        
        let inputFieldsHtml = '';
        if (exercise_type === 'cardio') {
            inputFieldsHtml = `<div class="col-span-3"><label class="block text-xs text-gray-400 mb-1">운동 시간</label><select class="cart-select duration-select w-full"><option value="10">10분</option><option value="15">15분</option><option value="20">20분</option><option value="25">25분</option><option value="30" selected>30분</option><option value="40">40분</option><option value="50">50분</option><option value="60">60분</option></select></div>`;
        } else {
            inputFieldsHtml = `<div><label class="block text-xs text-gray-400 mb-1">세트</label><input type="number" class="cart-input sets-input w-full" value="3" min="1"></div><div><label class="block text-xs text-gray-400 mb-1">반복</label><input type="number" class="cart-input reps-input w-full" value="12" min="1"></div><div><label class="block text-xs text-gray-400 mb-1">무게(kg)</label><input type="number" class="cart-input weight-input w-full" value="20" min="0"></div>`;
        }

        li.innerHTML = `<div class="flex justify-between items-start"><div class="flex items-center gap-3"><img src="${gif_url}" alt="${name}" class="w-12 h-12 rounded-md border border-gray-600 object-cover" /><div><div class="font-semibold text-white">${name}</div><div class="text-xs text-gray-400">${muscle_group}</div></div></div><button onclick="removeFromCart(this, '${name.replace(/'/g, "\\'")}')" class="text-gray-500 hover:text-red-400 text-lg leading-none">×</button></div><div class="grid grid-cols-3 gap-2 mt-3">${inputFieldsHtml}</div>`;
        cart.appendChild(li);
    }

    function removeFromCart(buttonElement, name) {
        buttonElement.closest('li').remove();
        const filteredList = allFetchedExercises.filter(ex => ex.name.toLowerCase().includes(document.getElementById('search-exercise-input').value.toLowerCase()));
        renderExerciseList(filteredList);
    }

    function submitCustomPlan() {
        const cartItems = document.querySelectorAll('#customCart li');
        if (cartItems.length === 0) { alert("최소 1개 이상의 운동을 선택해주세요!"); return; }
        const exercisesData = Array.from(cartItems).map(li => {
            const exerciseType = li.dataset.type;
            let data = { name: li.dataset.name };
            if (exerciseType === 'cardio') {
                data.duration = li.querySelector('.duration-select').value;
            } else {
                data.sets = li.querySelector('.sets-input').value;
                data.reps = li.querySelector('.reps-input').value;
                data.weight = li.querySelector('.weight-input').value;
            }
            return data;
        });
        const exercisesJson = JSON.stringify(exercisesData);
        window.location.href = `${customPlanUrl}?exercises=${encodeURIComponent(exercisesJson)}`;
    }
    
    function loadExercises(group, buttonElement) {
        currentPage = 1;
        document.getElementById('search-exercise-input').value = '';
        if (currentActiveButton) { currentActiveButton.classList.remove('active'); }
        buttonElement.classList.add('active');
        currentActiveButton = buttonElement;
        const listContainer = document.getElementById("exerciseList");
        showSkeletonLoader(listContainer, 10);
        document.getElementById('pagination-controls').innerHTML = '';
        fetch(`${exerciseApiUrl}?muscle_group=${group}`)
            .then(res => { if (!res.ok) throw new Error('서버 응답 오류'); return res.json(); })
            .then(data => {
                allFetchedExercises = data.exercises || [];
                renderExerciseList(allFetchedExercises);
            })
            .catch(err => { listContainer.innerHTML = `<div class='flex items-center justify-center h-full text-red-400'>오류: ${err.message}</div>`; });
    }

    function filterExercises(searchTerm) {
        const filtered = allFetchedExercises.filter(ex => ex.name.toLowerCase().includes(searchTerm.toLowerCase()));
        renderExerciseList(filtered);
    }
    
   function renderExerciseList(exercises) {
        const listContainer = document.getElementById("exerciseList");
        const paginationContainer = document.getElementById("pagination-controls");
        listContainer.innerHTML = "";
        paginationContainer.innerHTML = "";
        
        if (exercises.length === 0) {
            listContainer.innerHTML = "<div class='flex items-center justify-center h-full text-gray-500'>일치하는 운동이 없습니다.</div>";
            return;
        }
        
        const startIndex = (currentPage - 1) * itemsPerPage;
        const endIndex = startIndex + itemsPerPage;
        const paginatedItems = exercises.slice(startIndex, endIndex);

        const cartNames = new Set([...document.querySelectorAll('#customCart li')].map(li => li.dataset.name));
        
        paginatedItems.forEach(ex => {
            const isAdded = cartNames.has(ex.name);
            const item = document.createElement("div");
            // [수정됨] 전체 아이템의 클릭 액션은 isAdded가 아닐 때만 적용
            item.className = `exercise-item flex items-center gap-4 p-3 rounded-lg transition-colors hover:bg-gray-700/50 ${isAdded ? 'added' : 'cursor-pointer'}`;
            item.dataset.name = ex.name;
            const escapedName = ex.name.replace(/'/g, "\\'");
            
            if (!isAdded) {
                item.setAttribute("onclick", `addToCart('${escapedName}', '${ex.muscle_group}', '${ex.gif_url}', '${ex.exercise_type}')`);
            }
            
            // [수정됨] 버튼과 상태 표시를 위한 HTML 구조 개선
            const actionsHtml = `
                <div class="flex items-center gap-2 ml-auto">
                    <button onclick="showExerciseDetails(event, '${escapedName}')" 
                            class="bg-gray-700 text-cyan-300 hover:bg-gray-600 hover:text-cyan-200 transition-colors px-3 py-1.5 rounded-md text-xs font-semibold" 
                            title="자세히 보기">
                        운동 자세 보기
                    </button>
                    ${isAdded ? `
                        <div class="flex items-center gap-1.5 text-emerald-400 text-xs font-bold px-3 py-1.5 bg-emerald-900/50 rounded-md">
                            <i class="bi bi-check-circle"></i>
                            <span>추가됨</span>
                        </div>
                    ` : ''}
                </div>
            `;

            item.innerHTML = `
                <img src="${ex.gif_url}" alt="${ex.name}" class="w-14 h-14 object-cover rounded-md border-2 border-gray-600 flex-shrink-0" />
                <div class="flex-grow">
                    <span class="exercise-name text-gray-200 font-semibold">${ex.name}</span>
                    <p class="text-xs text-gray-400">${ex.muscle_group}</p>
                </div>
                ${actionsHtml}
            `;
            listContainer.appendChild(item);
        });

        const totalPages = Math.ceil(exercises.length / itemsPerPage);
        if (totalPages > 1) {
            for (let i = 1; i <= totalPages; i++) {
                const pageButton = document.createElement('button');
                pageButton.textContent = i;
                pageButton.className = 'pagination-button';
                if (i === currentPage) {
                    pageButton.classList.add('active');
                }
                pageButton.onclick = () => changePage(i, exercises);
                paginationContainer.appendChild(pageButton);
            }
        }
    }
    
    function changePage(page, fullList) {
        currentPage = page;
        renderExerciseList(fullList);
    }
    
    function showSkeletonLoader(container, count) {
        container.innerHTML = '';
        for (let i = 0; i < count; i++) {
            const skeleton = document.createElement('div');
            skeleton.className = 'flex items-center gap-3 p-2 animate-pulse';
            skeleton.innerHTML = `<div class="w-12 h-12 bg-gray-700 rounded flex-shrink-0"></div><div class="h-4 bg-gray-700 rounded w-3/4"></div>`;
            container.appendChild(skeleton);
        }
    }

    async function showExerciseDetails(event, exerciseName) {
        event.stopPropagation();
        const exercise = allFetchedExercises.find(ex => ex.name === exerciseName);
        if (!exercise) return;

        modalTitle.textContent = exercise.name;
        modalGif.src = exercise.gif_url;
        modalGif.alt = exercise.name + " GIF";
        
        document.body.classList.add('modal-open');
        modal.classList.remove('hidden');
        modalBackdrop.classList.remove('hidden');
        modalYoutubeContainer.innerHTML = `<div class="text-gray-400 text-center animate-pulse">YouTube 영상 검색 중...</div>`;

        try {
            const searchQuery = encodeURIComponent(exercise.name + " 운동");
            const response = await fetch(`${youtubeSearchApiUrl}?q=${searchQuery}`);
            if (!response.ok) throw new Error(`서버 오류: ${response.statusText}`);
            const data = await response.json();
            modalYoutubeContainer.innerHTML = '';
            if (data.videos && data.videos.length > 0) {
                data.videos.forEach(video => {
                    const videoLink = document.createElement('a');
                    videoLink.href = `https://www.youtube.com/watch?v=${video.video_id}`;
                    videoLink.target = '_blank';
                    videoLink.rel = 'noopener noreferrer';
                    videoLink.className = 'block bg-gray-900/50 p-3 rounded-lg hover:bg-gray-700 transition-colors text-decoration-none';
                    videoLink.innerHTML = `
                        <div class="flex gap-4 items-start">
                            <img src="${video.thumbnail_url}" alt="${video.title}" class="w-24 h-16 object-cover rounded flex-shrink-0">
                            <p class="text-sm text-gray-300">${video.title}</p>
                        </div>`;
                    modalYoutubeContainer.appendChild(videoLink);
                });
            } else {
                modalYoutubeContainer.innerHTML = `<div class="text-gray-500 text-center">관련 영상을 찾을 수 없습니다.</div>`;
            }
        } catch (error) {
            console.error("YouTube 영상 검색 실패:", error);
            modalYoutubeContainer.innerHTML = `<div class="text-red-400 text-center">영상을 불러오는 중 오류가 발생했습니다.</div>`;
        }
    }

    function hideExerciseDetails() {
        document.body.classList.remove('modal-open');
        modal.classList.add('hidden');
        modalBackdrop.classList.add('hidden');
        modalYoutubeContainer.innerHTML = '';
    }
</script>
{% endblock %}
