<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>비밀번호 재설정</title>
</head>
<body style="font-family: 'Malgun Gothic', '맑은 고딕', sans-serif; line-height: 1.6;">
    
    <div style="max-width: 600px; margin: 0 auto; padding: 20px; text-align: center;">
        
        <p>안녕하세요, {{ user.username }}님.</p>

        <p>HealthWise 계정의 비밀번호 재설정을 요청하셨습니다.<br>
           아래 버튼을 클릭하여 새 비밀번호를 설정해주세요.</p>

        <table border="0" cellpadding="0" cellspacing="0" width="100%" style="margin: 30px 0;">
            <tr>
                <td align="center">
                    <table border="0" cellpadding="0" cellspacing="0">
                        <tr>
                            <td align="center" style="background-color: #87CEFA; border-radius: 30px; padding: 12px 35px; text-align: center;">
                                <a href="{{ activation_link }}" target="_blank" style="font-size: 1.15em; font-weight: bold; color: #ffffff; text-decoration: none; display: inline-block;">
                                    비밀번호 재설정
                                </a>
                            </td>
                        </tr>
                    </table>
                </td>
            </tr>
        </table>

        <p>만약 본인이 요청하지 않으셨다면 이 이메일을 무시하셔도 됩니다.</p>
        
        <!-- ▼▼▼▼▼ 구분선(<hr>)을 완전히 삭제했습니다 ▼▼▼▼▼ -->

        <p style="margin-top: 30px;">감사합니다.<br>
          - HealthWise 팀 드림 - </p>

    </div>
</body>
</html>
