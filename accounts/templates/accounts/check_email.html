{% load static custom_translate i18n %}

<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> {% t '이메일 인증 안내' %} </title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap');

        :root {
            --bg-dark: #000000;
            --bg-surface: #1a1a1a;
            --text-primary: #f0f0f0;
            --text-secondary: #a0a0a0;
            --accent-pink: #ff8c94;
            --accent-teal: #68d3d9;
            --accent-yellow: #ffcf68;
        }

        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-primary);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            margin: 0;
            padding: 15vh 20px 0;
            box-sizing: border-box;
            background-image:
                radial-gradient(circle at 15% 25%, rgba(255, 140, 148, 0.12), transparent 35%),
                radial-gradient(circle at 85% 75%, rgba(104, 211, 217, 0.12), transparent 35%),
                radial-gradient(circle at 50% 50%, rgba(255, 207, 104, 0.07), transparent 40%);
            background-attachment: fixed;
        }

        .gradient-title {
            background: linear-gradient(90deg, var(--accent-pink), var(--accent-yellow), var(--accent-teal));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            font-weight: 700;
            text-align: center;
        }

        h1.page-main-title {
            margin-bottom: 40px;
            font-size: 2.5rem;
        }

        .email-check-container {
            background-color: rgba(16, 16, 16, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 40px 50px;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.37);
            width: 100%;
            max-width: 580px;
            text-align: center;
            border: 2px solid transparent;
            background-image: linear-gradient(rgba(16, 16, 16, 0.85), rgba(16, 16, 16, 0.85)), 
                              linear-gradient(90deg, var(--accent-pink), var(--accent-teal));
            background-origin: border-box;
            background-clip: padding-box, border-box;
        }

        .email-check-container h2 {
            margin-top: 0;
            margin-bottom: 30px;
            font-size: 2rem;
        }

        .email-check-container p {
            color: var(--text-secondary);
            font-size: 16px;
            line-height: 1.8;
            margin-bottom: 20px;
        }

        .email-check-container p strong {
            font-weight: 600;
            color: var(--accent-yellow); /* 중요한 안내는 노란색으로 강조 */
        }
        
        .email-check-container p:last-child {
            margin-bottom: 0;
        }

        .email-check-container .highlight-text {
            font-weight: 600;
            color: var(--accent-pink); /* 스팸 메일함 강조는 핑크색으로 */
        }
    </style>
</head>
<body>
    <h1 class="page-main-title gradient-title"> {% t '가입까지 마지막 한 단계!' %} </h1>

    <div class="email-check-container">
        <h2 class="gradient-title"> {% t '이메일 인증을 완료해주세요' %} </h2>
        
        <p>
            {% t '회원가입 신청이 정상적으로 접수되었습니다.' %}
        </p>
        <p>
            <strong>
                {% t '메일함에서 인증 링크를 클릭하셔야 최종적으로 회원가입이 완료됩니다.' %}
            </strong>
        </p>
        <p>
            {% t '이메일을 받지 못하셨다면' %} 
            <span class="highlight-text"> {% t '스팸 메일함' %} </span>
            {% t '을 확인해보시거나, 잠시 후 다시 시도해주세요.' %}
        </p>
    </div>
</body>
</html>
