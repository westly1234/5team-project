{% load static custom_translate i18n %}

<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>{% t '아이디 찾기' %}</title>
    <!-- Font Awesome 아이콘 라이브러리 추가 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap');

        :root {
            --bg-dark: #000000;
            --bg-surface: #1a1a1a;
            --bg-input: #2d2d2d;
            --border-color: #444444;
            --text-primary: #f0f0f0;
            --text-secondary: #a0a0a0;
            --accent-pink: #ff8c94;
            --accent-teal: #68d3d9;
            --accent-yellow: #ffcf68;
        }

        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-primary);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            background-image:
                radial-gradient(circle at 15% 25%, rgba(255, 140, 148, 0.12), transparent 35%),
                radial-gradient(circle at 85% 75%, rgba(104, 211, 217, 0.12), transparent 35%),
                radial-gradient(circle at 50% 50%, rgba(255, 207, 104, 0.07), transparent 40%);
            background-attachment: fixed;
        }

        .form-container {
            /* ✨ 1. 홈 버튼의 위치 기준점으로 설정 ✨ */
            position: relative; 
            
            background-color: rgba(16, 16, 16, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            
            /* ✨ 2. 박스 크기 및 패딩 조정 ✨ */
            padding: 50px 60px; /* 위아래, 좌우 패딩을 늘려 내부 여백 확보 */
            
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.37);
            width: 100%;
            
            /* ✨ 2. 최대 너비 키우기 ✨ */
            max-width: 480px; /* 기존 420px에서 480px로 변경 */
            
            border: 2px solid transparent;
            background-image: linear-gradient(rgba(16, 16, 16, 0.85), rgba(16, 16, 16, 0.85)), 
                              linear-gradient(90deg, var(--accent-pink), var(--accent-teal));
            background-origin: border-box;
            background-clip: padding-box, border-box;
        }
        
        /* ✨ 1. 홈 버튼 스타일 추가 (login.html과 동일) ✨ */
        .home-button {
          position: absolute;
          top: 30px; 
          left: 35px;
          font-size: 1.3rem;
          color: var(--text-secondary);
          text-decoration: none;
          transition: all 0.3s ease;
          z-index: 10;
        }
    
        .home-button:hover {
          color: var(--accent-teal);
          transform: scale(1.1);
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 30px;
            text-align: center;
            font-weight: 700;
            background: linear-gradient(90deg, var(--accent-pink), var(--accent-yellow), var(--accent-teal));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            /* ✨ 홈 버튼 공간 확보를 위한 패딩 추가 ✨ */
            padding-top: 20px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            font-weight: 500;
            display: block;
            margin-bottom: 8px;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        input[type="email"] {
            width: 100%;
            padding: 12px 15px;
            background-color: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 1rem;
            transition: all 0.3s;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.3);
            box-sizing: border-box;
        }

        input[type="email"]:focus {
            border-color: var(--accent-teal);
            box-shadow: 0 0 0 3px rgba(104, 211, 217, 0.3), inset 0 2px 4px rgba(0,0,0,0.3);
            outline: none;
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            background-image: linear-gradient(to right, var(--accent-teal) 0%, #a7f3d0 51%, var(--accent-teal) 100%);
            background-size: 200% auto;
            border: none;
            color: white;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 700;
            transition: all 0.3s ease-in-out;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .btn-submit:hover {
            background-position: right center;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }

        .errorlist {
            color: var(--accent-pink);
            font-size: 0.9rem;
            margin-bottom: 15px;
            list-style: none;
            padding-left: 0;
            background-color: rgba(255, 140, 148, 0.1);
            border: 1px solid rgba(255, 140, 148, 0.2);
            border-radius: 8px;
            padding: 10px 15px;
        }

        .result-message {
            margin-top: 25px;
            padding: 15px;
            text-align: center;
            background-color: rgba(104, 211, 217, 0.1);
            border: 1px solid rgba(104, 211, 217, 0.2);
            border-radius: 8px;
            color: var(--text-secondary);
            font-size: 1rem;
        }
        
        .result-message strong {
            color: var(--accent-teal);
            font-weight: 700;
            margin-right: 8px;
        }
    </style>
</head>
<body>
    <div class="form-container">
        
        <!-- ✨ 1. 홈 버튼 HTML 추가 (login.html과 동일) ✨ -->
        <a href="{% url 'home' %}" class="home-button" title="{% t '홈으로' %}">
          <i class="fas fa-home"></i>
        </a>
        
        <h1>{% t '아이디 찾기' %}</h1>
        <form method="POST">
            {% csrf_token %}
            {{ form.non_field_errors }}
            <div class="form-group">
                {{ form.email.label_tag }}
                {{ form.email }}
                {{ form.email.errors }}
            </div>
            <button type="submit" class="btn-submit">{% t '아이디 찾기' %}</button>
        </form>

        {% if username %}
            <p class="result-message">
                <strong>{% t '가입된 아이디' %}:</strong> {{ username }}
            </p>
        {% endif %}
    </div>
</body>
</html>
