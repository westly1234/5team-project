{% load static %}
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HealthWise - 히어로 섹션</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Roboto+Flex:opsz,wght@8..144,400;8..144,500;8..144,700&display=swap" rel="stylesheet">

<style>
    body {
        margin: 0; /* body의 기본 마진 제거 */
        font-family: 'Noto Sans KR', 'Roboto Flex', sans-serif;
        background-color: #FFFFF0 !important; /* ★★★★★ 아이보리색 배경 강제 적용 ★★★★★ */
        line-height: 1.6;
        color: #333;
    }

    /* --- 새로운 히어로 섹션 스타일 시작 --- */
    .new-hero-section-container {
        width: 100%;
    }

    .new-hero-section {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 5%;
        max-width: 2000px;
        margin: 0 auto;
        min-height: 95vh;
        padding: 40px 20px;
        box-sizing: border-box;
        background-color: #FFFFF0;
    }

    .hero-image-column {
        flex: 0 0 50%; /* 이미지 컬럼 너비 (텍스트 컬럼과 합쳐서 100% 근처로) */
        max-width: 600px;
        align-self: stretch;
        display: flex;
        align-items: center;
    }

    .hero-image-wrapper {
        width: 100%;
        aspect-ratio: 38 / 28;
        overflow: hidden;
        border-radius: 0 !important;
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
    }

    .hero-image-wrapper img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        border-radius: 0 !important;
        object-position: 20% 20%;
    }

    .hero-text-column {
        flex: 0 0 45%; /* 텍스트 컬럼 너비 */
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center; /* 내부 요소들 가운데 정렬 */
    }

    .hero-label {
        font-size: 0.9rem;
        color: #b08d57;
        font-weight: 500;
        margin-bottom: 12px;
        letter-spacing: 0.8px;
        text-transform: uppercase;
        text-align: center;
    }

    .hero-title {
        font-size: 2.8rem;
        font-weight: 700;
        color: #3a3a3a;
        margin-bottom: 20px;
        line-height: 1.35;
        text-align: center;
    }

    .hero-subtitle {
        font-size: 1.1rem;
        color: #606060;
        margin-bottom: 30px;
        line-height: 1.7;
        text-align: center;
    }

    .hero-btn {
        padding: 12px 20px;
        font-size: 1rem;
        font-weight: 500;
        color: #A0522D;
        background-color: transparent;
        border: 1.5px solid #A0522D;
        border-radius: 25px;
        text-decoration: none;
        transition: all 0.3s ease;
        display: inline-block;
        /* max-width: 150px; */ /* 필요시 활성화 */
        /* width: 100%; */    /* 주석 처리 또는 삭제 (모바일에서는 아래에서 다시 설정) */
        box-sizing: border-box;
        text-align: center;
    }

    .hero-btn:hover {
        background-color: #A0522D;
        color: #fff;
        transform: translateY(-2px);
        box-shadow: 0 4px 10px rgba(160, 82, 45, 0.2);
    }

    /* 반응형 스타일 */
    @media (max-width: 992px) {
        .new-hero-section {
            flex-direction: column;
            gap: 40px;
            min-height: auto;
            padding: 60px 20px;
        }
        .hero-image-column,
        .hero-text-column {
            width: 100%;
            max-width: 550px;
            flex: none; /* 비율 해제 */
        }
        .hero-text-column {
            order: 1;
        }
        .hero-image-column {
            order: 2;
        }
        .hero-image-wrapper {
            aspect-ratio: 16 / 10;
            max-width: 500px;
            margin-left: auto;
            margin-right: auto;
        }
        .hero-title { font-size: 2.4rem; }
        .hero-subtitle { font-size: 1rem; }
    }

    @media (max-width: 768px) {
        .new-hero-section { padding: 50px 15px; gap: 30px; }
        .hero-title { font-size: 2.2rem; }
    }

    @media (max-width: 480px) {
        .new-hero-section { padding: 40px 15px; }
        .hero-image-wrapper {
            aspect-ratio: 4 / 3;
        }
        .hero-title { font-size: 1.8rem; }
        .hero-subtitle { font-size: 0.9rem; }
        .hero-btn {
            width: 100%;
            max-width: none;
            box-sizing: border-box;
        }
    }
    /* --- 새로운 히어로 섹션 스타일 끝 --- */
</style>
</head>
<body>


    <div class="new-hero-section-container">
        <section class="new-hero-section">
            <div class="hero-image-column">
                <div class="hero-image-wrapper">
                    <!-- ❗️❗️❗️실제 이미지 파일명으로 변경해주세요! 예: 'main-hero.jpg' 또는 '요가하는 사람.jpg' -->
                    <img src="{% static 'images/main-hero.jpg' %}" alt="운동 후 만족스러운 여성">
                </div>
            </div>
            <div class="hero-text-column">
                <p class="hero-label">인생을 내 몸에 담다</p>
                <h1 class="hero-title">인생은 흘려보내는 것이 아니라<br>내 몸에 담는 것</h1>
                <p class="hero-subtitle">
                    건강이 주인공을 만듭니다.<br>
                    당신이 주인공인 것을 잊지 않게!<br> 당신만을 위한 운동과 식단을 계획하고 알려드리겠습니다!
                </p>
                <a href="#" class="btn hero-btn">지금 시작하기</a>
            </div>
        </section>
    </div>
   

</body>
</html>
