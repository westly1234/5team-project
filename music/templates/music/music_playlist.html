{% extends "web/dashboard_sliding_base.html" %}
{% load static %}

{% block title %}AI 음악 추천 - HealthWise{% endblock %}

{% block page_content %}
<style>
    /* 음악 추천 앱 전용 스타일 */
    .music-app-wrapper {
        display: flex;
        height: 100%;
        width: 100%;
    }
    .music-sidebar {
        width: 280px;
        background: #121212;
        padding: 30px 20px;
        display: flex;
        flex-direction: column;
        flex-shrink: 0;
        border-right: 1px solid rgba(255, 255, 255, 0.1);
    }
    .music-sidebar h3 {
        font-size: 1.5rem; margin-bottom: 30px; font-weight: 700;
        background: linear-gradient(90deg, #ff6b6b, #4ecdc4) !important;
        -webkit-background-clip: text !important; background-clip: text !important;
        -webkit-text-fill-color: transparent !important;
    }
    .form-group { margin-bottom: 25px; }
    label { display: block; margin-bottom: 8px; font-weight: 500; color: rgba(255, 255, 255, 0.7); }
    select {
      width: 100%; padding: 12px; border-radius: 8px; border: 1px solid rgba(255, 255, 255, 0.2);
      background-color: rgba(255, 255, 255, 0.05); color: #fff; font-size: 14px; outline: none; transition: all 0.2s;
    }
    select:hover { border-color: #4ecdc4; }
    select option { background: #282828; color: #fff; }
    .music-sidebar button {
      padding: 12px; border-radius: 8px; background-color: #4ecdc4;
      color: #000; font-weight: bold; border: none; cursor: pointer;
      transition: all 0.2s ease; width: 100%;
    }
    .music-sidebar button:hover { background-color: #5ff5e1; transform: scale(1.02); }
    .music-sidebar button:disabled { background-color: #555; color: #999; cursor: not-allowed; }
    .music-main-content {
      flex: 1; padding: 30px 40px; overflow-y: auto;
    }
    .section-title {
      font-size: 2rem; margin-bottom: 25px; color: #fff;
      font-weight: 800; border-left: 4px solid #4ecdc4; padding-left: 15px;
    }
    .grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 24px; margin-bottom: 50px;
    }
    .card {
      background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 16px; border-radius: 12px; text-align: left; transition: all 0.3s ease;
    }
    .card a { text-decoration: none; }
    .card:hover { transform: translateY(-5px); background: rgba(255, 255, 255, 0.05); border-color: rgba(78, 205, 196, 0.5); }
    .card img { width: 100%; border-radius: 8px; aspect-ratio: 1 / 1; object-fit: cover; margin-bottom: 12px; }
    .card-title {
      font-size: 1rem; color: #fff; font-weight: 600; white-space: nowrap;
      overflow: hidden; text-overflow: ellipsis;
    }
    .card-sub {
      font-size: 0.9rem; color: rgba(255, 255, 255, 0.6); margin-top: 6px;
      display: -webkit-box; -webkit-line-clamp: 2; line-clamp: 2;
      -webkit-box-orient: vertical; overflow: hidden; text-overflow: ellipsis; min-height: 40px;
    }
    
    /* 이 페이지의 메인 콘텐츠 영역에서 모든 패딩을 제거하여 전체 화면을 사용하도록 함 */
    .page-main-content {
        box-sizing: border-box !important;
        padding: 0 !important;
        height: calc(100vh - 65px) !important;
    }
</style>

<div class="music-app-wrapper">
    <div class="music-sidebar">
        <h3>AI 추천 설정</h3>
        <div class="form-group">
            <label for="exercise">운동 종류</label>
            <select id="exercise">
                <option value="헬스">헬스</option>
                <option value="요가 또는 필라테스">요가/필라테스</option>
                <option value="조깅">조깅</option>
                <option value="고강도 인터벌 트레이닝 (HIIT)">HIIT</option>
                <option value="가벼운 산책">산책</option>
            </select>
        </div>
        <div class="form-group">
            <label for="mood">오늘의 기분</label>
            <select id="mood">
                <option value="최고로 집중해서">최고로 집중해서</option>
                <option value="지치지만 이겨내고 싶을 때">지치지만 이겨내고 싶을 때</option>
                <option value="에너지 넘치게">에너지 넘치게</option>
                <option value="편안하고 차분하게">편안하고 차분하게</option>
            </select>
        </div>
        <button id="ai-button" onclick="requestAIMusic()">AI 추천 받기</button>
    </div>
    <div class="music-main-content">
        <div class="section-title">오늘의 핫리스트</div>
        <div class="grid" id="hotlist-grid"></div>

        <div class="section-title">AI 추천 플레이리스트</div>
        <div class="grid" id="results"></div>
    </div>
</div>

{% csrf_token %}
<script>
    const youtubeKey = "{{ youtube_api_key }}";
    const csrfToken = document.querySelector('[name=csrfmiddlewaretoken]').value;
    const aiButton = document.getElementById('ai-button');

    async function loadHotlists() {
        const hotlistPlaylistIds = [
            'PL4fGSI1pDJn5kI81J1fYC0_B5P5vIqSD_', // K-Hitlist
            'PL4fGSI1pDJn5Fh5bT4I4r0n3429_m82s2', // BEAT ON (댄스)
            'PL4fGSI1pDJn4J4b9I5B-g-ajG_i8Z_5D_', // 감성촉촉 발라드
            'PL4fGSI1pDJn5r_42M4u4-l5iSTa2H4V8a'  // Pop on the Rise
        ];
        const hotlistContainer = document.getElementById('hotlist-grid');
        hotlistContainer.innerHTML = '<p style="color: #aaa; grid-column: 1 / -1;">핫리스트를 불러오는 중...</p>';
        try {
            const idsString = hotlistPlaylistIds.join(',');
            const res = await fetch(`https://www.googleapis.com/youtube/v3/playlists?part=snippet&id=${idsString}&key=${youtubeKey}`);
            const data = await res.json();
            if (data.error) {
                console.error("⛔️ YouTube API Error:", data.error.message);
                hotlistContainer.innerHTML = "<p style='color: #aaa; grid-column: 1 / -1;'>핫리스트를 불러오지 못했습니다. API 키 또는 할당량을 확인해주세요.</p>";
                return;
            }
            hotlistContainer.innerHTML = '';
            data.items.forEach(playlist => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `<a href="https://www.youtube.com/playlist?list=${playlist.id}" target="_blank"><img src="${playlist.snippet.thumbnails.high.url}" alt="${playlist.snippet.title}" /><div class="card-title">${playlist.snippet.title}</div><div class="card-sub">${playlist.snippet.description}</div></a>`;
                hotlistContainer.appendChild(card);
            });
        } catch (error) {
            console.error("네트워크 또는 코드 실행 오류:", error);
            hotlistContainer.innerHTML = "<p style='color: #aaa; grid-column: 1 / -1;'>핫리스트를 불러오는 데 실패했습니다.</p>";
        }
    }

    async function requestAIMusic() {
      const exercise = document.getElementById('exercise').value;
      const mood = document.getElementById('mood').value;
      const resultsContainer = document.getElementById('results');
      aiButton.disabled = true;
      aiButton.textContent = 'AI 분석 중...';
      resultsContainer.innerHTML = '';
      try {
        const res = await fetch('/music/api/ai-keywords/', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'X-CSRFToken': csrfToken },
          body: JSON.stringify({ exercise, mood })
        });
        const data = await res.json();
        if (data.error) {
          alert('AI 추천 실패: ' + data.error);
          return;
        }
        if (!data.keywords || data.keywords.length === 0) {
            resultsContainer.innerHTML = '<p style="color: #aaa;">추천 키워드를 찾지 못했습니다.</p>';
            return;
        }
        const promises = data.keywords.map(keyword => 
            fetch(`https://www.googleapis.com/youtube/v3/search?part=snippet&maxResults=1&q=${encodeURIComponent(keyword)}&type=video&key=${youtubeKey}`).then(response => response.json())
        );
        const ytResults = await Promise.all(promises);
        ytResults.forEach((ytData, index) => {
            if (ytData.items && ytData.items.length > 0) {
                const v = ytData.items[0];
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `<a href="https://www.youtube.com/watch?v=${v.id.videoId}" target="_blank"><img src="${v.snippet.thumbnails.high.url}" alt="${v.snippet.title}" /><div class="card-title">${v.snippet.title}</div><div class="card-sub">${v.snippet.channelTitle}</div><div class="card-sub" style="font-size:11px; color:#888; margin-top: 8px;">🔎 ${data.keywords[index]}</div></a>`;
                resultsContainer.appendChild(card);
            }
        });
      } catch (error) {
        console.error("Error fetching AI music:", error);
        alert("오류가 발생했습니다.");
      } finally {
        aiButton.disabled = false;
        aiButton.textContent = 'AI 추천 받기';
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
        setTimeout(() => { loadHotlists(); }, 100); 
    });
</script>
{% endblock %}
