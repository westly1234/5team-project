{% extends "web/dashboard_sliding_base.html" %}
{% load static %}

{% block title %}운동 장소 찾기 - HealthWise{% endblock %}

{% block page_content %}
<style>
    /* ... (다른 스타일들은 이전과 동일) ... */
    @keyframes fadeInUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* 지도와 컨트롤 패널을 담는 컨테이너 */
    .map-container {
        /* ✨ [수정] position을 absolute로 변경하여 부모의 여백(padding) 제약에서 벗어납니다. */
        position: absolute; 
        
        /* ✨ [수정] 상단은 헤더 높이(65px)만큼 아래에 위치시킵니다. */
        top: 65px; 
        
        /* ✨ [수정] 화면의 왼쪽, 오른쪽, 아래쪽 끝에 딱 붙도록 설정하여 공간을 꽉 채웁니다. */
        left: 0;
        right: 0;
        bottom: 0;
    }
    #map {
        width: 100%; 
        height: 100%;
    }
    #control-panel {
        position: absolute; top: 20px; left: 20px;
        background: rgba(10, 10, 10, 0.7); backdrop-filter: blur(15px);
        padding: 20px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        z-index: 10; width: 360px; max-width: calc(100vw - 40px);
        display: flex; flex-direction: column; gap: 16px; 
        border: 1px solid rgba(255, 255, 255, 0.1);
        animation: fadeInUp 0.5s ease-out forwards; animation-delay: 0.2s; opacity: 0;
        /* 컨트롤 패널의 높이는 지도 컨테이너의 높이에 맞춰지도록 수정합니다. */
        height: calc(100% - 40px); 
        max-height: calc(100vh - 105px); /* 헤더(65px)와 상하 여백(40px)을 고려한 최대 높이 */
    }
    /* ... (이하 모든 CSS 및 HTML, JavaScript는 이전과 동일합니다) ... */
    #control-panel h1 {
        font-size: 24px; font-weight: 700; color: #fff; display: flex;
        align-items: center; gap: 10px; padding-bottom: 8px;
        background: linear-gradient(90deg, #ff6b6b, #4ecdc4);
        -webkit-background-clip: text; background-clip: text;
        -webkit-text-fill-color: transparent;
    }
    .search-box { display: flex; gap: 8px; }
    .search-box input {
        flex: 1; padding: 10px 14px; border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 8px; font-size: 15px; color: #fff; background-color: rgba(255, 255, 255, 0.05);
        transition: all 0.2s;
    }
    .search-box input::placeholder { color: rgba(255, 255, 255, 0.5); }
    .search-box input:focus {
        outline: none; border-color: #4ecdc4; background-color: rgba(255, 255, 255, 0.1);
        box-shadow: 0 0 0 3px rgba(78, 205, 196, 0.25); 
    }
    .search-box button {
        padding: 0 12px; background: #4ecdc4; color: #000; border: none;
        border-radius: 8px; cursor: pointer; font-weight: bold; transition: all 0.2s; font-size: 16px;
    }
    .search-box button:hover { background: #5ff5e1; transform: translateY(-1px); }
    .status {
        padding: 10px 12px; border-radius: 8px; font-size: 13px; font-weight: 500;
        background-color: rgba(255, 255, 255, 0.05); color: rgba(255, 255, 255, 0.7);
        border: 1px solid rgba(255, 255, 255, 0.1); display: flex; align-items: center; gap: 8px;
        transition: all 0.3s ease-in-out;
    }
    .action-button {
        width: 100%; padding: 10px 15px; border: none; border-radius: 8px; cursor: pointer;
        font-size: 15px; font-weight: 500; transition: all 0.2s; display: flex;
        align-items: center; justify-content: center; gap: 8px;
    }
    .my-location-btn { background: #4ecdc4; color: #000; font-weight: 600; }
    .my-location-btn:hover { background: #5ff5e1; }
    #reSearchBtn { background: #8e8e93; color: #fff; }
    #reSearchBtn:hover { background: #aeaeb2; }
    #reSearchBtn.show { display: flex !important; animation: fadeInUp 0.3s ease-out; }

    #category-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
        gap: 8px;
        padding-top: 8px;
        border-top: 1px solid rgba(255, 255, 255, 0.1);
    }
    .category-grid-btn {
        padding: 9px 10px; font-size: 13px; font-weight: 500; border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 8px; background-color: rgba(255, 255, 255, 0.05); color: rgba(255, 255, 255, 0.8);
        cursor: pointer; transition: all 0.2s ease; display: flex; align-items: center; justify-content: center; gap: 6px;
    }
    .category-grid-btn:hover {
        background-color: rgba(255, 255, 255, 0.1); border-color: #4ecdc4; color: #fff;
    }
    .category-grid-btn.active {
        background-color: #4ecdc4; color: #000; font-weight: 700; border-color: #4ecdc4;
    }
    .results-container {
        display: flex; flex-direction: column; background-color: rgba(255, 255, 255, 0.02);
        border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 12px; overflow: hidden;
        flex: 1; min-height: 0;
    }
    #results-header {
        padding: 8px 16px; font-size: 13px; color: rgba(255, 255, 255, 0.7);
        border-bottom: 1px solid rgba(255, 255, 255, 0.1); display: none; flex-shrink: 0;
    }
    #results {
        overflow-y: auto; flex: 1;
    }
    .results::-webkit-scrollbar { width: 6px; }
    .results::-webkit-scrollbar-track { background: transparent; }
    .results::-webkit-scrollbar-thumb { background: #444; border-radius: 3px; }
    .results::-webkit-scrollbar-thumb:hover { background: #666; }
    .result-item {
        padding: 12px 16px; border-bottom: 1px solid rgba(255, 255, 255, 0.1); cursor: pointer;
        transition: background-color 0.2s, transform 0.2s; opacity: 0; transform: translateY(5px);
        animation: fadeInUp 0.4s ease-out forwards;
    }
    .result-item:last-child { border-bottom: none; }
    .result-item:hover { background: rgba(78, 205, 196, 0.1); transform: translateX(3px); }
    .result-item strong { color: #fff; font-size: 15px; font-weight: 500; display: block; margin-bottom: 3px; }
    .result-item .address { color: rgba(255, 255, 255, 0.6); font-size: 12px; line-height: 1.3; }
    .result-item .phone { color: #4ecdc4; margin-top: 4px; font-size: 12px; display: flex; align-items: center; gap: 6px; }
    .empty-results {
        text-align: center; padding: 40px 20px; color: rgba(255, 255, 255, 0.6); font-size: 14px;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; height: 100%;
    }
    .empty-results i { font-size: 32px; color: #4ecdc4; }
    .spinner {
        width: 24px; height: 24px; border: 3px solid #444; border-top-color: #4ecdc4;
        border-radius: 50%; animation: spin 0.8s linear infinite;
    }
    .custom-infowindow-content {
        padding: 12px 15px; min-width: 240px; font-family: 'Pretendard', sans-serif;
        line-height: 1.6; background: #2c2c2e; color: #fff; border-radius: 12px;
        box-shadow: 0 5px 15px rgba(0,0,0,0.3); animation: fadeInUp 0.3s ease-out;
        border: 1px solid rgba(255, 255, 255, 0.15);
    }
    .custom-infowindow-content strong { color: #fff; font-size: 15px; display: block; margin-bottom: 6px; }
    .custom-infowindow-content .info-item { color: rgba(255, 255, 255, 0.8); font-size: 13px; margin-bottom: 4px; }
    .custom-infowindow-content .info-item .label { color: #4ecdc4; font-weight: 500; }
    .custom-infowindow-content .link-actions { margin-top: 10px; display: flex; gap: 8px; }
    .custom-infowindow-content .link-actions a {
        font-size: 13px; text-decoration: none; padding: 6px 12px; border-radius: 8px;
        transition: all 0.2s; font-weight: 500; color: #000 !important;
    }
    .custom-infowindow-content .link-actions a:hover { opacity: 0.9; transform: translateY(-1px); }
    .custom-infowindow-content .link-actions a.details-link { background-color: #8e8e93; }
    .custom-infowindow-content .link-actions a.directions-link { background-color: #4ecdc4; }
    
    .skeleton-item { background: rgba(255, 255, 255, 0.05); padding: 16px; border-bottom: 1px solid rgba(255, 255, 255, 0.1); animation: pulse-bg 1.5s infinite ease-in-out; }
    @keyframes pulse-bg { 0% { background: rgba(255,255,255,0.05); } 50% { background: rgba(255,255,255,0.08); } 100% { background: rgba(255,255,255,0.05); } }
    .skeleton-item .line { background: rgba(255, 255, 255, 0.1); height: 12px; border-radius: 4px; margin-bottom: 10px; }
    .skeleton-item .line.short { width: 60%; }
</style>

<div class="map-container">
    <div id="map"></div>
    <div id="control-panel">
        <h1><i class="bi bi-geo-alt-fill"></i> 내 주변 운동 장소 찾기</h1>
        <div class="status" id="status">위치 정보를 가져오는 중...</div>
        <button class="action-button my-location-btn" onclick="moveToCurrentLocation()">
            <i class="bi bi-cursor-fill"></i> 내 현재 위치로 이동
        </button>
        <button class="action-button" id="reSearchBtn" onclick="reSearch()" style="display: none;">
            <i class="bi bi-arrow-repeat"></i> 이 지역에서 다시 검색
        </button>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="운동 시설 직접 검색">
            <button onclick="searchCustom()"><i class="bi bi-search"></i></button>
        </div>
        
        <div id="category-grid">
            <button class="category-grid-btn active" onclick="searchCategory('헬스장')"><i class="bi bi-person-arms-up"></i> 헬스장</button>
            <button class="category-grid-btn" onclick="searchCategory('요가')"><i class="bi bi-peace-fill"></i> 요가</button>
            <button class="category-grid-btn" onclick="searchCategory('수영장')"><i class="bi bi-water"></i> 수영장</button>
            <button class="category-grid-btn" onclick="searchCategory('테니스장')"><i class="bi bi-dribbble"></i> 테니스</button>
            <button class="category-grid-btn" onclick="searchCategory('축구장')"><i class="bi bi-record-circle-fill"></i> 축구장</button>
            <button class="category-grid-btn" onclick="searchCategory('탁구장')"><i class="bi bi-disc-fill"></i> 탁구장</button>
        </div>

        <div class="results-container">
            <div id="results-header"></div>
            <div id="results">
                <div class="empty-results" id="initial-message">
                    <i class="bi bi-compass"></i>
                    <span>위치 정보를 기반으로 주변 시설을 찾습니다.<br>위 카테고리를 선택하거나 직접 검색해보세요.</span>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // ... (이전과 동일한 JavaScript 코드)
    let map, ps, infowindow, currentPosition, myLocationMarker, clusterer;
    let markers = [], currentCategory = '';
    const statusEl = document.getElementById('status');
    const resultsHeaderEl = document.getElementById('results-header');
    const resultsEl = document.getElementById('results');
    const reSearchBtnEl = document.getElementById('reSearchBtn');

    function initMap() {
        const container = document.getElementById('map'), options = { center: new kakao.maps.LatLng(37.5665, 126.9780), level: 4 };
        map = new kakao.maps.Map(container, options); ps = new kakao.maps.services.Places();
        infowindow = new kakao.maps.InfoWindow({ zIndex: 1, disableAutoPan: true });
        clusterer = new kakao.maps.MarkerClusterer({ map: map, averageCenter: true, minLevel: 6, styles: [{ width : '36px', height : '36px', background: 'rgba(78, 205, 196, 0.9)', borderRadius: '18px', color: '#000', textAlign: 'center', fontWeight: 'bold', lineHeight: '36px', fontSize: '13px', border: '1px solid rgba(0,0,0,0.1)' }] });
        const zoomControl = new kakao.maps.ZoomControl();
        map.addControl(zoomControl, kakao.maps.ControlPosition.BOTTOMRIGHT);
        kakao.maps.event.addListener(map, 'dragend', () => { reSearchBtnEl.style.display = 'flex'; reSearchBtnEl.classList.add('show'); });
        
        document.getElementById('searchInput').addEventListener('keypress', (e) => { if (e.key === 'Enter') searchCustom(); });
        
        getCurrentLocation(true);
    }
    
    function getCurrentLocation(isInitialLoad = false) {
        if (!navigator.geolocation) { updateStatus('브라우저가 위치 정보를 지원하지 않습니다', 'error'); if (isInitialLoad) searchDefaultCategory(); return; }
        updateStatus('⏳ 위치 정보를 가져오는 중...', 'loading');
        navigator.geolocation.getCurrentPosition(
            (position) => {
                const lat = position.coords.latitude, lng = position.coords.longitude;
                currentPosition = new kakao.maps.LatLng(lat, lng);
                if (myLocationMarker) myLocationMarker.setMap(null);
                myLocationMarker = new kakao.maps.Marker({ map: map, position: currentPosition, image: new kakao.maps.MarkerImage('https://t1.daumcdn.net/localimg/localimages/07/mapapidoc/markerStar.png', new kakao.maps.Size(24, 35)), title: '내 위치' });
                if (isInitialLoad) { map.setCenter(currentPosition); updateStatus(`✅ 현재 위치 (${lat.toFixed(4)}, ${lng.toFixed(4)})`, 'success'); searchDefaultCategory(); }
                else { map.panTo(currentPosition); updateStatus(`✅ 현재 위치로 부드럽게 이동했습니다.`, 'success'); }
            },
            () => { updateStatus('❌ 위치 정보를 가져올 수 없습니다. 기본 위치에서 검색합니다.', 'error'); currentPosition = null; if (isInitialLoad) searchDefaultCategory(); }
        );
    }
    
    function searchDefaultCategory() {
        searchCategory('헬스장');
    }

    function moveToCurrentLocation() { if (currentPosition) { map.panTo(currentPosition); } else { getCurrentLocation(false); } }

    function executeSearch(keyword, isCategorySearch) {
        clearAll();
        showSkeletonUI();
        updateStatus(`⏳ '${keyword}' 검색 중...`, 'loading');
        ps.keywordSearch(keyword, placesSearchCB, { location: map.getCenter(), radius: isCategorySearch ? 2000 : 3000, sort: kakao.maps.services.SortBy.DISTANCE });
        reSearchBtnEl.style.display = 'none';
    }

    function searchCategory(category) {
        currentCategory = category;
        document.querySelectorAll('.category-grid-btn').forEach(btn => { 
            btn.classList.remove('active'); 
            if (btn.textContent.includes(category)) {
                btn.classList.add('active');
            }
        });
        document.getElementById('searchInput').value = '';
        executeSearch(category, true);
    }

    function searchCustom() {
        const keyword = document.getElementById('searchInput').value;
        if (!keyword.trim()) { alert('검색어를 입력해주세요.'); return; }
        currentCategory = ''; 
        document.querySelectorAll('.category-grid-btn').forEach(btn => btn.classList.remove('active'));
        executeSearch(keyword, false);
    }

    function reSearch() {
        const activeCategoryBtn = document.querySelector('.category-grid-btn.active');
        const searchKeyword = activeCategoryBtn ? activeCategoryBtn.textContent.trim().split(" ").pop() : document.getElementById('searchInput').value || '헬스장';
        executeSearch(searchKeyword, !!activeCategoryBtn);
    }

    function placesSearchCB(data, status) {
        if (status === kakao.maps.services.Status.OK) {
            const filterRules = {'탁구장':{keywords:['카페','치킨','노래방','음식점'] },'공원':{keywords:['음식점','치킨','노래방','대리점','카페','통닭','자동차','편의점','분식','주차장']},'요가':{keywords:['필라테스','피부관리','마사지','카페','치킨','음식점','편의점','자동차','약국']},'수영장':{keywords:['사우나','찜질방','치킨','편의점','음식점','카페','주차장']},'테니스장':{keywords:['편의점','카페','음식점','중고차','자동차']},'축구장':{keywords:['편의점','카페','음식점','주차장','자동차']}};
            let filtered = currentCategory && filterRules[currentCategory] ? data.filter(p => !filterRules[currentCategory].keywords.some(k => (p.place_name || '').includes(k) || (p.category_name || '').includes(k))) : (currentCategory ? data : data.filter(p => p.category_group_code === 'SP0' || (p.category_name || '').includes('체육시설')));
            
            if (filtered.length > 0) {
                displayPlaces(filtered);
                updateStatus(`✅ ${filtered.length}개의 시설을 찾았습니다.`, 'success');
                resultsHeaderEl.textContent = `총 ${filtered.length}개의 결과`;
                resultsHeaderEl.style.display = 'block';
            } else {
                showEmptyResultsMessage();
            }
        } else if (status === kakao.maps.services.Status.ZERO_RESULT) {
            showEmptyResultsMessage();
        } else {
            updateStatus(`❌ 검색 중 오류가 발생했습니다: ${status}`, 'error');
            resultsEl.innerHTML = `<div class="empty-results"><i class="bi bi-exclamation-triangle-fill"></i><span>오류가 발생했습니다.<br>잠시 후 다시 시도해주세요.</span></div>`;
        }
    }
    
    function showEmptyResultsMessage() {
        updateStatus(`ℹ️ 주변에 관련 시설이 없습니다.`, 'info');
        resultsEl.innerHTML = `<div class="empty-results"><i class="bi bi-emoji-frown"></i><span>검색 결과가 없습니다.<br>지도 위치를 옮기거나 다른 키워드로 검색해보세요.</span></div>`;
        resultsHeaderEl.style.display = 'none';
    }

    function displayPlaces(places) {
        const bounds = new kakao.maps.LatLngBounds(); 
        resultsEl.innerHTML = '';
        places.forEach((place, index) => {
            const placePosition = new kakao.maps.LatLng(place.y, place.x);
            const marker = addMarker(placePosition, index, place.place_name);
            const itemEl = createListItem(index, place);

            itemEl.style.animationDelay = `${index * 0.05}s`;
            resultsEl.appendChild(itemEl); 
            bounds.extend(placePosition);
            
            itemEl.addEventListener('mouseover', () => marker.setZIndex(100));
            itemEl.addEventListener('mouseout', () => marker.setZIndex(0));
            
            kakao.maps.event.addListener(marker, 'click', () => { displayInfowindow(marker, place); map.panTo(placePosition); }); 
            itemEl.onclick = () => { map.panTo(placePosition); displayInfowindow(marker, place); };
        });
        clusterer.addMarkers(markers);
    }
    
    function addMarker(position, idx, title) {
        const marker = new kakao.maps.Marker({ 
            position: position, 
            title: title, 
            image: new kakao.maps.MarkerImage('https://t1.daumcdn.net/localimg/localimages/07/mapapidoc/marker_number_blue.png', new kakao.maps.Size(36, 37), { spriteSize: new kakao.maps.Size(36, 691), spriteOrigin: new kakao.maps.Point(0, (idx * 45) + 10), offset: new kakao.maps.Point(13, 37) }) 
        });
        markers.push(marker); return marker;
    }
    
    function createListItem(index, place) {
        const el = document.createElement('div'); el.className = 'result-item';
        el.innerHTML = `<strong>${index + 1}. ${place.place_name}</strong><div class="address" title="${place.road_address_name || place.address_name}">${place.road_address_name || place.address_name}</div>${place.phone ? `<div class="phone"><i class="bi bi-telephone-fill"></i> ${place.phone}</div>` : ''}`;
        return el;
    }

    function displayInfowindow(marker, place) {
        document.querySelectorAll('.result-item.active').forEach(item => item.classList.remove('active'));
        const content = `<div class="custom-infowindow-content"><strong>${place.place_name}</strong><div class="info-item"><span class="label">주소:</span> ${place.road_address_name || place.address_name}</div>${place.phone ? `<div class="info-item"><span class="label">전화:</span> ${place.phone}</div>` : ''}<div class="link-actions"><a href="${place.place_url}" target="_blank" class="details-link">상세정보</a><a href="https://map.kakao.com/link/to/${encodeURIComponent(place.place_name)},${place.y},${place.x}" target="_blank" class="directions-link">길찾기</a></div></div>`;
        infowindow.setContent(content); infowindow.open(map, marker);
    }

    function clearAll() { 
        if (clusterer) clusterer.clear(); 
        markers.forEach(marker => marker.setMap(null)); 
        markers = []; 
        infowindow.close();
        resultsEl.innerHTML = '';
        resultsHeaderEl.style.display = 'none';
    }

    function showSkeletonUI() {
        let skeletonHTML = '';
        for (let i = 0; i < 5; i++) {
            skeletonHTML += `<div class="skeleton-item"><div class="line"></div><div class="line short"></div></div>`;
        }
        resultsEl.innerHTML = skeletonHTML;
    }

    function updateStatus(message, type) {
        statusEl.innerHTML = message.includes('⏳') ? `<div class="spinner"></div> ${message.replace('⏳ ','')}` : message;
        let bgColor, textColor;
        switch(type) {
            case 'loading': bgColor = 'rgba(255, 255, 255, 0.05)'; textColor = 'rgba(255, 255, 255, 0.7)'; break;
            case 'error': bgColor = 'rgba(255, 107, 107, 0.15)'; textColor = '#ff6b6b'; break;
            case 'success': bgColor = 'rgba(78, 205, 196, 0.15)'; textColor = '#4ecdc4'; break;
            case 'info': bgColor = 'rgba(90, 200, 250, 0.15)'; textColor = '#5AC8FA'; break;
            default: bgColor = 'rgba(255, 255, 255, 0.05)'; textColor = 'rgba(255, 255, 255, 0.7)';
        }
        statusEl.style.backgroundColor = bgColor; statusEl.style.color = textColor;
    }

    document.addEventListener('DOMContentLoaded', () => {
        const script = document.createElement('script');
        script.src = `//dapi.kakao.com/v2/maps/sdk.js?appkey={{ kakao_map_api_key }}&libraries=services,clusterer&autoload=false`;
        script.async = true;
        
        script.onload = () => {
            kakao.maps.load(initMap);
        };

        document.head.appendChild(script);
    });
</script>
{% endblock %}
